[package]
name = "media-box-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "media-box 生态核心库：媒体扫描、输出路径推导、VMAF 目标搜索与 SVT-AV1 编码"

[dependencies]
anyhow.workspace = true
# 终端渲染与 Ctrl+C 处理只在 `app` feature 下编译：纯计算/文件类下游（如
# image-convert）关掉默认特性即可不引入这两个依赖。
crossterm = { workspace = true, optional = true }
ctrlc = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
# 仅基准使用，不进入任何正式构建。
# criterion 固定 0.7：0.8 在 windows/unix 上无条件依赖 alloca（C 编译），0.7 无此依赖。
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# 只开 Criterion 适配层；剖析能力（hotpath / hotpath-alloc / hotpath-callgrind）由本 crate 的 feature 按需转发。
hotpath = { version = "0.33", default-features = false, features = ["criterion-0-7"] }

[[bench]]
name = "media_box_core"
harness = false

[features]
# 应用装配层：终端仪表盘、Ctrl+C 处理与压缩流水线编排。纯计算下游
# （image-convert）用 default-features = false 关掉，不编译 crossterm/ctrlc。
default = ["app"]
app = ["dep:crossterm", "dep:ctrlc"]
# 本地剖析，全部 opt-in：未启用时 hotpath 的宏与适配层都是 no-op，不编译任何剖析依赖。
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-callgrind = ["hotpath", "hotpath/hotpath-callgrind"]

[lints]
workspace = true
