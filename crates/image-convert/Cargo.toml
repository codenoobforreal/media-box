[package]
name = "image-convert"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "纯 Rust 的图片批量格式转换工具"

[features]
# 默认全开：产品定位是能力完备的转换工具；全关可编译出纯 image 内置的最小构建。
default = ["jxl", "heif"]
jxl = ["dep:jxl-oxide", "dep:zune-jpegxl", "dep:zune-core"]
heif = ["dep:heif-oxide"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
image.workspace = true
media-box-core.workspace = true
thiserror.workspace = true
# 以下均为纯 Rust、宽松许可：接入 image 0.25 的解码 hook，并提供 JXL 无损编码
# （核验时点 2026-11-23）。PNG 优化使用 image 内置 PngEncoder，无需额外依赖。
jxl-oxide = { version = "0.12", optional = true, features = ["image"] } # MIT OR Apache-2.0
heif-oxide = { version = "0.2", optional = true } # MIT OR Apache-2.0
zune-jpegxl = { version = "0.5", optional = true } # MIT OR Apache-2.0 OR Zlib
zune-core = { version = "0.5", optional = true } # MIT OR Apache-2.0 OR Zlib

[lints]
workspace = true
