[workspace]
resolver = "3"
members = ["crates/media-box", "crates/media-box-core", "crates/image-convert"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# 默认特性全部关闭，只启用代码实际用到的特性，避免引入无用依赖与编译开销。
anyhow = { version = "1", default-features = false, features = ["std"] }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "cargo"] }
crossterm = { version = "0", default-features = false, features = ["windows"] }
ctrlc = "3"
thiserror = { version = "2", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = [
    "bmp", "gif", "jpeg", "png", "webp",
] }
media-box-core = { path = "crates/media-box-core" }
# 仅作 dev-dependency：基准与性能测试使用，不进入任何正式构建。
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# 只开 Criterion 适配层；剖析能力（hotpath / hotpath-alloc / hotpath-callgrind）由各 crate 的 feature 按需转发。
# criterion 固定 0.7：0.8 在 windows/unix 上无条件依赖 alloca（C 编译），0.7 无此依赖。
hotpath = { version = "0.33", default-features = false, features = ["criterion-0-7"] }

[workspace.lints.clippy]
complexity = "deny"
perf = "deny"
style = "deny"

[profile.release]
strip = true
lto = true
