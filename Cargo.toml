[workspace]
resolver = "3"
members = ["crates/media-box", "crates/media-box-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["cargo", "derive"] }
crossterm = "0"
ctrlc = "3"
thiserror = "2"
media-box-core = { path = "crates/media-box-core" }

[workspace.lints.clippy]
complexity = "deny"
perf = "deny"
style = "deny"

[profile.release]
strip = true
lto = true
